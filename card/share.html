<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Card</title>
    <style>
        body { background: #0a1628; display: flex; align-items: center; justify-content: center; min-height: 100dvh; font-family: -apple-system, sans-serif; color: white; }
        .msg { text-align: center; font-size: 18px; opacity: 0.7; }
    </style>
</head>
<body>
    <p class="msg">Sharing...</p>
    <script>
        (async () => {
            const url = 'https://pathque.com/card';
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Martin V. Burks, IV M.D., MBA, FCAP',
                        text: 'Connect with Dr. Martin Burks',
                        url: url
                    });
                    window.close();
                } catch(e) {
                    window.location.href = url;
                }
            } else {
                window.location.href = url;
            }
        })();
    </script>
</body>
</html>
