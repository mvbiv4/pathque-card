<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Martin V. Burks, IV — MD, MBA, FCAP</title>
    <meta name="description" content="Martin V. Burks, IV — Physician-Executive | Fractional Chief AI Officer">
    <meta property="og:title" content="Martin V. Burks, IV — MD, MBA, FCAP">
    <meta property="og:description" content="Physician-Executive · Fractional Chief AI Officer for Health Systems">
    <meta property="og:image" content="https://pathque.com/card/headshot.jpg">
    <meta property="og:url" content="https://pathque.com/card">
    <meta name="twitter:card" content="summary">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dr. Burks">
    <meta name="theme-color" content="#0B1A2B">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="headshot.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0B1A2B;
            --card-bg: #0F1F33;
            --card-border: rgba(122, 27, 32, 0.18);
            --oxblood: #7A1B20;
            --oxblood-bright: #9B2227;
            --oxblood-glow: rgba(122, 27, 32, 0.1);
            --oxblood-glow-strong: rgba(122, 27, 32, 0.22);
            --ivory: #F6F2EA;
            --ivory-soft: rgba(246, 242, 234, 0.7);
            --ivory-muted: rgba(246, 242, 234, 0.4);
            --gold: #C9B896;
            --gold-muted: rgba(201, 184, 150, 0.3);
            --display: 'Fraunces', Georgia, serif;
            --body: 'Newsreader', Georgia, serif;
            --mono: 'IBM Plex Mono', ui-monospace, monospace;
        }

        html { font-size: 16px; }

        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--ivory);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(122, 27, 32, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(201, 184, 150, 0.04) 0%, transparent 50%);
            pointer-events: none;
            animation: ambientShift 20s ease-in-out infinite alternate;
        }

        @keyframes ambientShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-3%, 3%) rotate(2deg); }
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .card {
            background: linear-gradient(170deg, rgba(18, 34, 56, 0.95) 0%, rgba(11, 26, 43, 0.98) 100%);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 52px 36px 44px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(40px);
            box-shadow:
                0 0 0 1px rgba(122, 27, 32, 0.06),
                0 24px 80px -12px rgba(0, 0, 0, 0.5),
                0 0 120px -40px rgba(122, 27, 32, 0.1);
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--oxblood), transparent);
            opacity: 0;
            animation: lineReveal 1.2s ease 0.6s forwards;
        }

        @keyframes lineReveal { to { opacity: 0.6; } }

        .card::after {
            content: '';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-top: 1px solid rgba(122, 27, 32, 0.25);
            border-right: 1px solid rgba(122, 27, 32, 0.25);
            border-radius: 0 8px 0 0;
            opacity: 0;
            animation: cornerReveal 0.6s ease 1s forwards;
        }

        .corner-bl {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 24px;
            height: 24px;
            border-bottom: 1px solid rgba(122, 27, 32, 0.25);
            border-left: 1px solid rgba(122, 27, 32, 0.25);
            border-radius: 0 0 0 8px;
            opacity: 0;
            animation: cornerReveal 0.6s ease 1s forwards;
        }

        @keyframes cornerReveal { to { opacity: 1; } }

        .photo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            position: relative;
            opacity: 0;
            animation: photoReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        @keyframes photoReveal { to { opacity: 1; } }

        .photo-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(122, 27, 32, 0.35);
            animation: ringPulse 4s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { border-color: rgba(122, 27, 32, 0.35); transform: scale(1); }
            50% { border-color: rgba(122, 27, 32, 0.18); transform: scale(1.02); }
        }

        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--oxblood);
            box-shadow: 0 0 40px rgba(122, 27, 32, 0.2);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            filter: contrast(1.05) brightness(1.02);
        }

        .name {
            font-family: var(--display);
            font-weight: 400;
            font-variation-settings: "opsz" 72, "SOFT" 20;
            font-size: 28px;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--ivory);
            opacity: 0;
            animation: textReveal 0.6s ease 0.7s forwards;
        }

        @keyframes textReveal { to { opacity: 1; } }

        .credentials {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--oxblood-bright);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0;
            animation: textReveal 0.6s ease 0.85s forwards;
        }

        .rule {
            width: 40px;
            height: 1px;
            margin: 0 auto 28px;
            background: var(--oxblood);
            opacity: 0;
            animation: ruleReveal 0.8s ease 1s forwards;
        }

        @keyframes ruleReveal { to { opacity: 0.5; } }

        .role {
            text-align: center;
            font-family: var(--display);
            font-style: italic;
            font-variation-settings: "opsz" 36, "SOFT" 30;
            font-size: 17px;
            font-weight: 400;
            color: var(--ivory-soft);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            opacity: 0;
            animation: textReveal 0.6s ease 1.1s forwards;
        }

        .tagline {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 400;
            color: var(--ivory-muted);
            letter-spacing: 1px;
            line-height: 1.7;
            margin-bottom: 40px;
            opacity: 0;
            animation: textReveal 0.6s ease 1.25s forwards;
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 36px;
            opacity: 0;
            animation: textReveal 0.6s ease 1.4s forwards;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            background: rgba(122, 27, 32, 0.06);
            border: 1px solid rgba(122, 27, 32, 0.1);
            border-radius: 14px;
            text-decoration: none;
            color: var(--ivory);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact:active, .contact:hover {
            background: var(--oxblood-glow-strong);
            border-color: rgba(122, 27, 32, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px -8px rgba(122, 27, 32, 0.2);
        }

        .contact-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(122, 27, 32, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--oxblood-bright);
        }

        .contact-label {
            font-family: var(--mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--ivory-muted);
            margin-bottom: 2px;
        }

        .contact-value {
            font-family: var(--body);
            font-size: 14px;
            font-weight: 400;
            color: var(--ivory-soft);
        }

        .qr-section {
            text-align: center;
            margin-bottom: 32px;
            opacity: 0;
            animation: textReveal 0.6s ease 1.55s forwards;
        }

        .qr-label {
            font-family: var(--mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--ivory-muted);
            margin-bottom: 16px;
        }

        #qrcode {
            display: inline-block;
            padding: 14px;
            background: var(--ivory);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        #qrcode canvas { display: block; border-radius: 4px; }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            animation: textReveal 0.6s ease 1.7s forwards;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--oxblood) 0%, var(--oxblood-bright) 100%);
            color: var(--ivory);
            border: none;
            border-radius: 14px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px -4px rgba(122, 27, 32, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 12px -2px rgba(122, 27, 32, 0.45);
        }

        .btn-primary svg { width: 18px; height: 18px; fill: var(--ivory); }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: transparent;
            color: var(--oxblood-bright);
            border: 1px solid rgba(122, 27, 32, 0.3);
            border-radius: 14px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:active {
            background: var(--oxblood-glow);
            border-color: rgba(122, 27, 32, 0.45);
            transform: scale(0.98);
        }

        .btn-secondary svg { width: 18px; height: 18px; fill: var(--oxblood-bright); }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-family: var(--display);
            font-weight: 500;
            font-variation-settings: "opsz" 144, "SOFT" 0;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(122, 27, 32, 0.25);
            opacity: 0;
            animation: textReveal 0.6s ease 1.9s forwards;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--oxblood);
            color: var(--ivory);
            padding: 14px 28px;
            border-radius: 14px;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(122, 27, 32, 0.35);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 380px) {
            .card { padding: 40px 28px 36px; }
            .name { font-size: 24px; }
            .photo-container, .photo { width: 100px; height: 100px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="corner-bl"></div>

            <div class="photo-container">
                <div class="photo-ring"></div>
                <div class="photo">
                    <img src="headshot.jpg" alt="Martin V. Burks, IV">
                </div>
            </div>

            <h1 class="name">Martin V. Burks, IV</h1>
            <p class="credentials">MD · MBA · FCAP</p>

            <div class="rule"></div>

            <p class="role">Physician-Executive · Clinical AI Governance</p>

            <div class="contacts">

                <a href="https://linkedin.com/in/martinburks" target="_blank" rel="noopener" class="contact">
                    <div class="contact-icon"><svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14m-.5 15.5v-5.3a3.26 3.26 0 00-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 011.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 001.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 00-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        const qr = qrcode(0, 'M');
        qr.addData('https://pathque.com/card');
        qr.make();
        const cellSize = 5, size = qr.getModuleCount(), cs = size * cellSize;
        const canvas = document.createElement('canvas');
        canvas.width = cs; canvas.height = cs;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#F6F2EA';
        ctx.fillRect(0, 0, cs, cs);
        ctx.fillStyle = '#0B1A2B';
        for (let r = 0; r < size; r++)
            for (let c = 0; c < size; c++)
                if (qr.isDark(r, c))
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        document.getElementById('qrcode').appendChild(canvas);

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast'; t.textContent = msg;
            document.body.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
        }

        async function shareCard() {
            const url = 'https://pathque.com/card';
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Martin V. Burks, IV — MD, MBA, FCAP',
                        text: 'Physician-Executive · Fractional Chief AI Officer for Health Systems',
                        url
                    });
                } catch(e) {
                    if (e.name !== 'AbortError') {
                        await navigator.clipboard.writeText(url);
                        showToast('Link copied!');
                    }
                }
            } else {
                await navigator.clipboard.writeText(url);
                showToast('Link copied to clipboard!');
            }
        }

        if ('serviceWorker' in navigator)
            navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
